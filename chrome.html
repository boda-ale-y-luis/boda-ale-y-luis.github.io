<style>
  body{background:#F5EED8;color:#334628;font-family:Georgia,serif;text-align:center;padding:60px 24px;margin:0}
  a{display:inline-block;margin-top:24px;background:#334628;color:#F5EED8;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:1.1rem}
</style>
<script>
  var siteUrl = "https://boda-ale-y-luis.github.io/?v=boton";
  var intentUrl = "intent://boda-ale-y-luis.github.io/?v=boton#Intent;scheme=https;package=com.android.chrome;end";
  var isAndroid = /Android/i.test(navigator.userAgent);
  var target = isAndroid ? intentUrl : siteUrl;
  window.location.replace(target);
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("openBtn");
    btn.href = target;
    btn.textContent = isAndroid ? "Abrir en Chrome" : "Abrir invitación";
    document.getElementById("msg").textContent = isAndroid ? "Abriendo la invitación en Chrome…" : "Abriendo la invitación…";
  });
</script>
</head>
<body>
  <h1 id="msg">Abriendo la invitación…</h1>
  <p>Si no se abre sola, toca el botón:</p>
  <a id="openBtn" href="https://boda-ale-y-luis.github.io/?v=boton">Abrir invitación</a>
</body>
